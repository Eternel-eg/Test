<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchanting Animated Scene</title>
    
    <!-- Beautiful elegant fonts for the wedding text -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base reset and layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111; /* Fallback color */
            font-family: sans-serif;
        }

        /* Shared background styles */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            z-index: 1;
            /* Subtle breathing animation for the backgrounds */
            animation: bg-breathe 20s ease-in-out infinite alternate;
        }

        #page1 .background {
            background-image: url('https://drive.google.com/thumbnail?id=19W5O94TRiV6O9tqIp3YDQ9cXbS1SjH8T&sz=s800');
        }

        #page2 .background {
            background-image: url('https://drive.google.com/thumbnail?id=1SmQkVmYLza7hPl0dZ2Nge0D4xCyOhP6G&sz=s800');
        }

        @keyframes bg-breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* --- PAGES SETUP --- */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* Foreground Items Container for Page 1 */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through */
            display: grid;
            place-items: center; /* Centers all grid items */
        }

        /* Wrapper controls the sequential appear animation */
        .item-wrapper {
            grid-area: 1 / 1; /* Stacks all items in the exact same spot */
            opacity: 0;
            transform: scale(0.8) translateY(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            width: clamp(200px, 40vw, 500px); /* Uniform size for perfect overlapping */
        }

        /* The class added via JS to trigger appearance */
        .item-wrapper.show {
            animation: appear 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Inner image controls the continuous float animation */
        .item-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 15px 15px rgba(0,0,0,0.3));
            animation: float 4s ease-in-out infinite alternate;
        }

        /* Appearance Animation */
        @keyframes appear {
            0% { 
                opacity: 0; 
                transform: scale(0.7) translateY(50px); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) translateY(0); 
            }
        }

        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(-1deg); }
        }

        /* --- PAGE 2 INVITATION STYLES --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Soft darkening layer */
            z-index: 2;
        }

        .invitation-content {
            position: absolute;
            top: 50%; /* TO MOVE UPWARD: Change this value to something like 35% or 40% */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
            /* Entrance animation for text */
            opacity: 0;
            transform: translate(-50%, -40%);
            transition: all 1.5s ease 0.5s;
        }

        .page.active .invitation-content {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        .small-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            letter-spacing: 2px;
            margin: 20px 0;
            line-height: 1.6;
            color: #E6C27A; /* Solid elegant gold */
            text-shadow: 0px 2px 4px rgba(0,0,0,0.6);
            /* Soft glowing pulse */
            animation: text-pulse 4s ease-in-out infinite alternate;
        }

        @keyframes text-pulse {
            0% { opacity: 0.85; text-shadow: 0px 2px 4px rgba(0,0,0,0.6); }
            100% { opacity: 1; text-shadow: 0px 2px 12px rgba(230,194,122,0.4); }
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(4rem, 10vw, 7rem);
            margin: 10px 0;
            font-weight: normal;
            
            /* Gold Gradient with continuous Shimmer */
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #BF953F);
            background-size: 200% auto;
            color: #D4AF37; /* Fallback for browsers that don't support clip */
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            animation: gold-shimmer 5s infinite linear;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        @keyframes gold-shimmer {
            to {
                background-position: 200% center;
            }
        }

        .names .ampersand {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            display: block;
            margin: -5px 0;
            -webkit-text-fill-color: #FFF2CD; /* Slightly brighter for contrast */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* --- NAVIGATION BUTTONS --- */
        .nav-btn {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-50%) scale(1.05);
        }

        /* --- RAIN PARTICLES --- */
        #rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .flower {
            position: absolute;
            top: -10%;
            opacity: 0;
            will-change: transform, opacity;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                top: -10%;
                opacity: 0;
                transform: rotate(0deg) translateX(0px);
            }
            10% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                top: 110%;
                opacity: 0;
                transform: rotate(var(--rot-end, 360deg)) translateX(var(--x-drift, 50px));
            }
        }
    </style>
</head>
<body>

    <!-- PAGE 1 (Original Scene) -->
    <div id="page1" class="page active">
        <div class="background"></div>

        <!-- Foreground Animated Layered Items -->
        <div class="scene-container">
            <div class="item-wrapper" id="item1">
                <img src="https://drive.google.com/thumbnail?id=1SWwdezbPwzN7xGhUpDlhlrVOGXQ-Wjnq&sz=s800" alt="Scene Item 1" style="animation-delay: 0s;">
            </div>
            
            <div class="item-wrapper" id="item2">
                <img src="https://drive.google.com/thumbnail?id=11fsB_A4G0fSu5_xMQ-pfzh7ZOrHVCbfF&sz=s800" alt="Scene Item 2" style="animation-delay: -1.5s;">
            </div>
            
            <div class="item-wrapper" id="item3">
                <img src="https://drive.google.com/thumbnail?id=1U2dC2g8ZSq1X61jSk2-KQlRQZVGmK1i2&sz=s800" alt="Scene Item 3" style="animation-delay: -3s;">
            </div>

            <div class="item-wrapper" id="item4">
                <img src="https://drive.google.com/thumbnail?id=1sTj01ZxL0jSR3JOHFfPDHUEVALXN9CRj&sz=s800" alt="Scene Item 4" style="animation-delay: -4.5s;">
            </div>
        </div>
        
        <!-- Button to transition to Page 2 -->
        <button id="goToPage2" class="nav-btn">View Invitation</button>
    </div>

    <!-- PAGE 2 (Invitation Text) -->
    <div id="page2" class="page">
        <div class="background"></div>
        <div class="overlay"></div>
        
        <div class="invitation-content">
            <p class="small-text">Together with their families</p>
            <h1 class="names">Tahany <span class="ampersand">&</span> Ahmed</h1>
            <p class="small-text">Invite you to join them<br>for their wedding day</p>
        </div>

        <!-- Button to go back to Page 1 -->
        <button id="goToPage1" class="nav-btn">Back</button>
    </div>

    <!-- Flower Rain Layer (Global, stays above both pages) -->
    <div id="rain-container"></div>

    <!-- Background Music (place MP3 file in the same folder as this HTML) -->
    <audio id="bg-music" loop>
        <source src="Relaxing_Elegant___Romantic_Wedding_Instrumental_Music_Emotional_Wedding_Day_Background_Music_2__rgQEvk77hX4___mp3cut_net_.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Navigation Logic to switch between pages
        document.getElementById('goToPage2').addEventListener('click', () => {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
        });

        document.getElementById('goToPage1').addEventListener('click', () => {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        });

        // 2. Handle Sequential Item Appearances immediately
        const items = document.querySelectorAll('.item-wrapper');
        items.forEach((item, index) => {
            setTimeout(() => {
                item.classList.add('show');
            }, 800 + (index * 600)); 
        });

        // 3. Handle Continuous Flower Rain Generation
        const rainContainer = document.getElementById('rain-container');
        const rainImageUrl = 'https://drive.google.com/thumbnail?id=1tneiar3mdst9bCMnoEcAfoPD8iSk4OkK&sz=s800';

        function spawnFlower() {
            const flower = document.createElement('img');
            flower.src = rainImageUrl;
            flower.classList.add('flower');

            const size = Math.random() * 25 + 15;
            const leftPos = Math.random() * 100;
            const duration = Math.random() * 5 + 6;
            const delay = Math.random() * 2;
            
            const rotateDir = Math.random() > 0.5 ? 1 : -1;
            const targetRotation = rotateDir * (360 + Math.random() * 360);
            const driftAmount = (Math.random() - 0.5) * 150;

            flower.style.width = `${size}px`;
            flower.style.left = `${leftPos}vw`;
            flower.style.animationDuration = `${duration}s`;
            flower.style.animationDelay = `${delay}s`;
            
            flower.style.setProperty('--rot-end', `${targetRotation}deg`);
            flower.style.setProperty('--x-drift', `${driftAmount}px`);

            rainContainer.appendChild(flower);

            setTimeout(() => {
                if(flower.parentNode) {
                    flower.remove();
                }
            }, (duration + delay) * 1000);
        }

        setInterval(spawnFlower, 300);

        for(let i=0; i<8; i++) {
            setTimeout(spawnFlower, i * 100);
        }

        // 4. Background Music — starts on first user interaction
        const music = document.getElementById('bg-music');
        music.volume = 0.5;

        function startMusic() {
            music.play().catch(() => {});
            document.removeEventListener('click', startMusic);
            document.removeEventListener('touchstart', startMusic);
        }

        document.addEventListener('click', startMusic);
        document.addEventListener('touchstart', startMusic);
    </script>
</body>
</html>
